# Local databases: `docker compose up -d`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: baseapp
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']

  # Throwaway database for the Test Bot and Claude's test runs; it gets reset on every run.
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: baseapp_test
    ports: ['5433:5432']

volumes:
  pgdata:
